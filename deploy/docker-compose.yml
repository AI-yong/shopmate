# 개발·시연용. 운영에서는 DB 를 관리형(RDS/Cloud SQL)으로 두고 app 만 띄운다.
services:
  # 업무 데이터 (상품·재고·주문·장바구니) + 벡터
  shopdb:
    image: pgvector/pgvector:pg18          # Postgres 18 + pgvector 0.8.x
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: ${SHOPDB_PASSWORD:?set SHOPDB_PASSWORD}
    volumes:
      - shopdb:/var/lib/postgresql/data
      - ./schema_shop.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      retries: 10

  # 세션·에이전트 상태. 업무 DB 와 수명주기가 달라 분리한다.
  # 여기 데이터는 날아가도 되므로 볼륨을 붙이지 않는다 — 그게 정확한 동작이다.
  sessiondb:
    image: postgres:18
    environment:
      POSTGRES_DB: session
      POSTGRES_PASSWORD: ${SESSIONDB_PASSWORD:?set SESSIONDB_PASSWORD}
    volumes:
      - ./schema_session.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d session"]
      interval: 5s
      retries: 10

volumes:
  shopdb:
